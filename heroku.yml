setup:
  addons:
    - plan: heroku-postgresql:essential-0
    - plan: heroku-redis:mini
  config:
    JWT_SECRET: change-me-in-production
    LOG_LEVEL: INFO

build:
  docker:
    web:
      dockerfile: Dockerfile.heroku
      args:
        VITE_API_URL: https://${HEROKU_APP_NAME}.herokuapp.com

run:
  web: /app/start.sh
